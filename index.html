<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>生日快乐 🎂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: #ffffff;
    transition: background-color .8s ease;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                 "Noto Sans SC", "Source Han Sans SC", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  body.dark { background: #000000; }

  #fw {
    position: fixed;
    inset: 0;
    display: block;
    z-index: 1;
  }

  #stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #text {
    display: inline-block;
    font-size: clamp(30px, 9vw, 86px);
    font-weight: 600;
    letter-spacing: .1em;
    color: #111111;
    text-align: center;
    white-space: nowrap;
    opacity: 0;
    padding: .22em .55em;
    border-radius: 14px;
  }

  /* 依次浮现 */
  #text.show {
    animation: textIn .7s cubic-bezier(.2,.85,.25,1) forwards;
  }

  /* 最后的小鞭炮：可点击 + 呼吸感 */
  #text.boom {
    pointer-events: auto;
    cursor: pointer;
    animation: textIn .7s cubic-bezier(.2,.85,.25,1) forwards,
               boomPulse 1.5s ease-in-out .7s infinite;
  }

  @keyframes textIn {
    from { opacity: 0; transform: translateY(22px) scale(.93); filter: blur(10px); }
    to   { opacity: 1; transform: translateY(0)    scale(1);   filter: blur(0);   }
  }
  @keyframes boomPulse {
    0%, 100% { transform: scale(1);    opacity: 1;   }
    50%      { transform: scale(1.12); opacity: .82; }
  }

  /* 底部细长白字 */
  #wish {
    position: fixed;
    left: 0; right: 0;
    bottom: 12vh;
    z-index: 3;
    text-align: center;
    color: #ffffff;
    font-size: clamp(16px, 4.6vw, 30px);
    font-weight: 200;
    letter-spacing: .55em;
    text-indent: .55em;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.6s ease, transform 1.6s ease;
    pointer-events: none;
    text-shadow: 0 0 20px rgba(255,255,255,.55),
                 0 0 50px rgba(255,255,255,.25);
  }
  #wish.show { opacity: .94; transform: translateY(0); }
</style>
</head>
<body>

<canvas id="fw"></canvas>
<div id="stage"><span id="text"></span></div>
<div id="wish">许愿吧小寿星</div>

<script>
(function () {
  'use strict';

  /* ============ 基础 ============ */
  var canvas  = document.getElementById('fw');
  var ctx     = canvas.getContext('2d');
  var textEl  = document.getElementById('text');
  var wishEl  = document.getElementById('wish');

  var W = 0, H = 0;
  var darkMode = false;
  var started  = false;
  var rockets  = [];   // 上升中的烟花
  var particles = [];  // 爆炸后的粒子
  var lastTime = performance.now();

  function rand(a, b) { return a + Math.random() * (b - a); }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ============ 配色：紫 / 红 / 淡绿 / 蓝 / 橙 / 混合 ============ */
  var PALETTES = [
    ['#d8b4fe', '#c084fc', '#a855f7', '#8b5cf6'],           // 紫
    ['#ff6b6b', '#ff4d4d', '#ff2d55', '#ff9a9a'],           // 红
    ['#b9f6ca', '#a7f3c0', '#6ee7a8', '#d1fae5'],           // 淡绿
    ['#93c5fd', '#60a5fa', '#3b82f6', '#bfdbfe'],           // 蓝
    ['#fdba74', '#fb923c', '#f97316', '#fed7aa'],           // 橙
    ['#c084fc', '#ff4d4d', '#a7f3c0', '#60a5fa', '#fb923c', '#f472b6'] // 混合
  ];

  /* ============ 升空 ============ */
  function launchRocket() {
    var pal = PALETTES[Math.floor(Math.random() * PALETTES.length)];
    var tx  = rand(W * 0.15, W * 0.85);
    var ty  = rand(H * 0.10, H * 0.50);
    var sx  = tx + rand(-W * 0.10, W * 0.10);
    var sy  = H + 12;

    rockets.push({
      sx: sx, sy: sy, tx: tx, ty: ty,
      x: sx, y: sy,
      start: performance.now(),
      dur: rand(780, 1180),
      pal: pal
    });
  }

  /* ============ 炸开 ============ */
  function explode(x, y, pal) {
    var scale = Math.max(0.7, Math.min(W, H) / 760);
    var count = 150 + Math.floor(Math.random() * 70);

    // 中心闪光
    particles.push({
      x: x, y: y, vx: 0, vy: 0, color: '#ffffff',
      size: 70 * scale, life: 1, decay: 0.10,
      friction: 1, gravity: 0, flash: true
    });

    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = (1.6 + Math.pow(Math.random(), 0.55) * 9.5) * scale;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color: pal[Math.floor(Math.random() * pal.length)],
        size: (1.7 + Math.random() * 2.5) * scale,   // 大粒子
        life: 1,
        decay: 0.0055 + Math.random() * 0.0085,
        friction: 0.977 + Math.random() * 0.012,
        gravity: 0.022 + Math.random() * 0.022
      });
    }
  }

  /* ============ 更新：升空中的烟花 ============ */
  function updateRockets(now) {
    for (var i = rockets.length - 1; i >= 0; i--) {
      var r = rockets[i];
      var p = (now - r.start) / r.dur;

      if (p >= 1) {
        explode(r.tx, r.ty, r.pal);
        rockets.splice(i, 1);
        continue;
      }

      var e = 1 - Math.pow(1 - p, 2.2);            // 缓出
      r.x = r.sx + (r.tx - r.sx) * e;
      r.y = r.sy + (r.ty - r.sy) * e;

      ctx.globalCompositeOperation = 'lighter';

      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#ffe9a8';
      ctx.beginPath();
      ctx.arc(r.x, r.y, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.globalAlpha = 1;
      ctx.fillStyle = '#fffbe6';
      ctx.beginPath();
      ctx.arc(r.x, r.y, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ============ 更新：爆炸粒子 ============ */
  function updateParticles(k) {
    ctx.globalCompositeOperation = 'lighter';

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= p.decay * k;
      if (p.life <= 0) { particles.splice(i, 1); continue; }

      if (p.flash) {
        p.size *= Math.pow(0.87, k);
        var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
        g.addColorStop(0,   'rgba(255,255,255,0.85)');
        g.addColorStop(0.4, 'rgba(255,240,210,0.25)');
        g.addColorStop(1,   'rgba(255,255,255,0)');
        ctx.globalAlpha = p.life;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }

      p.vx *= Math.pow(p.friction, k);
      p.vy *= Math.pow(p.friction, k);
      p.vy += p.gravity * k;
      p.x  += p.vx * k;
      p.y  += p.vy * k;

      var a = p.life > 0 ? p.life : 0;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(p.size * (0.3 + 0.7 * a), 0.35), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ============ 主循环 ============ */
  function frame(now) {
    requestAnimationFrame(frame);

    var dt = now - lastTime;
    if (!(dt > 0) || dt > 60) dt = 16.7;
    lastTime = now;
    var k = dt / 16.667;

    if (darkMode) {
      // 黑底 + 半透明黑覆盖 => 拖尾
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(0,0,0,0.20)';
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.clearRect(0, 0, W, H);
    }

    if (rockets.length)   updateRockets(now);
    if (particles.length) updateParticles(k);
  }
  requestAnimationFrame(frame);

  /* ============ 文字依次浮现 ============ */
  var LINES = [
    '小惊喜～',
    '生日快乐！',
    '成年快乐！',
    '愿学姐的明天',
    '明天的明天',
    '幸福美满',
    '开开心心',
    '万事都有好结果',
    '🧨'
  ];

  function showLine(str, isLast) {
    textEl.textContent = str;
    textEl.classList.remove('show', 'boom');
    void textEl.offsetWidth;                 // 重置动画
    textEl.classList.add(isLast ? 'boom' : 'show');
  }

  async function intro() {
    for (var i = 0; i < LINES.length; i++) {
      var isLast = (i === LINES.length - 1);
      showLine(LINES[i], isLast);
      if (isLast) break;
      await sleep(1250);                     // 每个覆盖前一个
    }
  }

  /* ============ 文字淡出 ============ */
  function hideText() {
    var cs = getComputedStyle(textEl);
    textEl.style.opacity   = cs.opacity;
    textEl.style.transform = cs.transform;
    textEl.style.filter    = cs.filter;

    textEl.style.animation = 'none';
    textEl.classList.remove('show', 'boom');

    textEl.style.transition = 'opacity .6s ease, transform .6s ease, filter .6s ease';
    void textEl.offsetWidth;

    requestAnimationFrame(function () {
      textEl.style.opacity   = '0';
      textEl.style.transform = 'scale(1.15)';
      textEl.style.filter    = 'blur(8px)';
    });

    setTimeout(function () { textEl.style.visibility = 'hidden'; }, 750);
  }

  /* ============ 烟花排期：5 波 × 4 发 = 20 发 ============ */
  // 每一波同时升空 4 个（≥3），总时长约 20 秒
  var WAVES = [0, 3600, 7200, 10800, 14400];

  function fireAll() {
    WAVES.forEach(function (base) {
      for (var i = 0; i < 4; i++) {
        setTimeout(launchRocket, base + i * 150 + Math.random() * 120);
      }
    });
  }

  /* ============ 点击小鞭炮 → 开始烟花 ============ */
  function start() {
    if (started) return;
    if (!textEl.classList.contains('boom')) return;
    started = true;

    hideText();
    document.body.classList.add('dark');
    darkMode = true;                       // 切成纯黑背景

    setTimeout(fireAll, 500);              // 烟花开始
    setTimeout(function () {               // 底部白字浮现
      wishEl.classList.add('show');
    }, 900);

    setTimeout(function () {               // 20 秒后缓缓黑屏
      wishEl.classList.remove('show');
    }, 20500);
  }

  textEl.addEventListener('click', start);
  textEl.addEventListener('touchstart', function (e) {
    e.preventDefault();
    start();
  }, { passive: false });

  /* ============ 启动 ============ */
  intro();

})();
</script>
</body>
</html>
